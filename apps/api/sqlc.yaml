version: "2"

sql:
  - engine: postgresql
    schema: internal/migrations
    queries: queries
    gen:
      go:
        package: cestia
        out: internal/db/sqlc/cestia
        sql_package: pgx/v5
        emit_json_tags: true
        emit_empty_slices: true
        emit_interface: true
        emit_pointers_for_null_types: true

overrides:
  go:
    overrides:
      - db_type: uuid
        go_type:
          import: github.com/google/uuid
          type: UUID
      - db_type: uuid
        nullable: true
        go_type:
          import: github.com/google/uuid
          type: UUID
          pointer: true
      - db_type: timestamptz
        go_type:
          import: time
          type: Time
      - db_type: timestamptz
        nullable: true
        go_type:
          import: time
          type: Time
          pointer: true
      - db_type: jsonb
        go_type:
          import: encoding/json
          type: RawMessage
      - db_type: jsonb
        nullable: true
        go_type:
          import: encoding/json
          type: RawMessage
      - column: purchases.actual_unit_price
        go_type:
          type: string
          pointer: true
      - column: purchases.total_amount
        go_type:
          type: string
          pointer: true
      - column: shopping_list_items.estimated_unit_price
        go_type:
          type: string
          pointer: true
      - column: shopping_list_items.quantity
        go_type:
          type: string
      - column: purchases.quantity
        go_type:
          type: string
