name: cestia

services:
  db:
    image: postgres:17.6
    environment:
      POSTGRES_DB: ${DB_NAME:-cestia}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-cestia}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - cestia-db-data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  cestia-db-data:
