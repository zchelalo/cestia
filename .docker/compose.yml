name: cestia

services:
  db:
    image: postgres:17.6
    environment:
      POSTGRES_DB: ${DB_NAME:-cestia}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-cestia}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - cestia-db-data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  api:
    build:
      context: ../apps/api
      dockerfile: .docker/Dockerfile.dev
    working_dir: /workspace
    env_file:
      - ../apps/api/.env
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASS:-postgres}@db:5432/${DB_NAME:-cestia}?sslmode=disable
      HTTP_ADDR: :8000
      APP_ORIGIN: http://localhost:5173
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      REGISTER_RATE_LIMIT: ${REGISTER_RATE_LIMIT:-10}
    volumes:
      - ../apps/api:/workspace
      - cestia-go-mod:/go/pkg/mod
      - cestia-go-cache:/root/.cache/go-build
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    init: true
    stop_grace_period: 20s

volumes:
  cestia-db-data:
  cestia-go-mod:
  cestia-go-cache:
